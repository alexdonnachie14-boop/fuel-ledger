<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10233d"><title>Fuel Ledger</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"></head><body><main><header><small>PERSONAL MOTORING</small><h1>Fuel Ledger</h1><p>Know where your fuel money goes.</p></header><section class="card"><div class="row"><h2>Annual overview</h2><select id="year" aria-label="Year"></select></div><div class="total" id="total">£0.00</div><small>Total fuel spend</small><div class="metrics"><div><small>Fill-ups</small><strong id="count">0</strong></div><div><small>Average fill-up</small><strong id="average">£0.00</strong></div></div></section><section class="card"><div class="row"><h2>Spending over time</h2><select id="mode" aria-label="Graph type"><option value="running">Running total</option><option value="monthly">Monthly spend</option></select></div><svg id="chart" viewBox="0 0 360 210" role="img" aria-label="Fuel spending graph"></svg><p id="chartNote" class="muted"></p></section><section class="card"><h2 id="formTitle">Add a fill-up</h2><form id="entry"><label>Date<input type="date" id="date" required></label><label>Amount paid (£)<input type="number" id="cost" min="0.01" max="99999" step="0.01" inputmode="decimal" placeholder="65.00" required></label><label>Litres (optional)<input type="number" id="litres" min="0.01" max="9999" step="0.01" inputmode="decimal" placeholder="45.00"></label><label>Notes (optional)<input id="note" maxlength="120" placeholder="e.g. Tesco"></label><button id="save" type="submit">Save fill-up</button><button id="cancel" type="button" class="secondary" hidden>Cancel edit</button></form><p id="notice" role="status"></p></section><section class="card"><div class="row"><h2>Fill-up history</h2><button class="secondary compact" id="export">Export CSV</button></div><div id="history"></div></section><footer>Saved on this device only. Export your records regularly; clearing browser data can erase them.</footer></main><script src="script.js"></script></body></html>
